name: MiTo Team GoApp AutoRelease

on:
  workflow_call:
    inputs:
      dist_name:
        description: 'Prefix of distributive archive filename'
        required: true
        type: string
      draft_release:
        description: 'Create the GitHub Release as a draft'
        required: false
        type: boolean
        default: true # creating draft releases by default


jobs:
  BuildAndRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set environment variables
        run: echo "TERM=linux" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Checking out all submodules to the tip of a branch
        run: git submodule foreach --recursive git checkout main

      - name: Check if VERSION file exists
        run: |
          if [ ! -f "VERSION" ]; then
            echo "::error file=VERSION::Error: File 'VERSION' not found in repository root"
            exit 1
          fi

      - name: Set and show version number
        run: |
          VERSION=$(cat VERSION)
          echo "MT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release of v$VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '^1.27'
          check-latest: true

      - name: Set up 7-zip
        uses: milliewalky/setup-7-zip@v2

      - name: Build binaries and dists
        run: make build-all

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ inputs.draft_release }}
          tag_name: "v${{ env.MT_VERSION }}"
          files: |
            dist/${{ inputs.dist_name }}-${{ env.MT_VERSION }}-linux32.7z
            dist/${{ inputs.dist_name }}-${{ env.MT_VERSION }}-linux64.7z
            dist/${{ inputs.dist_name }}-${{ env.MT_VERSION }}-win32.7z
            dist/${{ inputs.dist_name }}-${{ env.MT_VERSION }}-win64.7z
            dist/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version url
        run: |
          echo "Version v${{ env.MT_VERSION }} page ${{ steps.release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
